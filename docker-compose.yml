version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: clientos_postgres
    environment:
      POSTGRES_USER: clientos_user
      POSTGRES_PASSWORD: clientos_password
      POSTGRES_DB: clientos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientos_user -d clientos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clientos_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: clientos_rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Web Management Dashboard port

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clientos_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://clientos_user:clientos_password@postgres:5432/clientos_db?schema=public"
      JWT_SECRET: "clientos_jwt_secret_production"
      REFRESH_SECRET: "clientos_refresh_secret_production"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: clientos_web
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata: